<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="telegram-web-app" content="yes">
  <title>Crash Game</title>
  <style>
    :root {
      --bg: #070b14; --card: #101524; --card2: #1a1f33;
      --text: #fff; --text2: #99a0b8; --accent: #00d4ff;
      --danger: #ff4757; --success: #2ed573; --radius: 16px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; user-select: none; -webkit-tap-highlight-color: transparent; }
    .app { max-width: 480px; margin: 0 auto; padding: 16px 16px 80px; }
    .screen { display: none; }
    .screen.active { display: block; }

    /* Loading */
    #loadingScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; }
    .spinner { width: 48px; height: 48px; border: 4px solid var(--card2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .balance { background: var(--card); padding: 8px 16px; border-radius: 40px; font-weight: 600; }
    button { border: none; background: var(--accent); color: #000; padding: 10px 18px; border-radius: 40px; font-weight: 700; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.4; pointer-events: none; }
    .btn-success { background: var(--success); color: #000; }
    .btn-danger { background: var(--danger); color: #fff; }

    /* Crash display */
    .crash-box { background: var(--card); border-radius: var(--radius); padding: 24px; text-align: center; }
    .multiplier { font-size: 72px; font-weight: 900; background: linear-gradient(135deg, #00d4ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .multiplier.crashed { background: linear-gradient(135deg, #ff4757, #ff6b81); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shake 0.5s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 40%{transform:translateX(10px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
    .phase { color: var(--text2); margin: 8px 0 16px; font-size: 14px; }
    .bet-row { display: flex; gap: 8px; margin-top: 16px; }
    .bet-row input { flex:1; background: var(--card2); border: 1px solid rgba(255,255,255,0.1); border-radius: 40px; padding: 12px 16px; color:#fff; font-size:16px; }

    /* History */
    .history { margin-top: 24px; }
    .history h3 { color: var(--text2); margin-bottom:12px; }
    .history-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .history-item { background: var(--card); border-radius: 20px; padding: 4px 12px; font-size: 14px; font-weight:600; }
    .history-item.crashed { color: var(--danger); }

    /* Profile */
    .profile-card { background: var(--card); border-radius: var(--radius); padding: 20px; display: flex; gap:16px; align-items: center; margin-bottom: 20px; }
    .profile-card img { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--accent); }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap:12px; }
    .stat-item { background: var(--card); border-radius: var(--radius); padding: 14px; text-align: center; }
    .stat-item .num { font-size: 22px; font-weight:700; color:var(--accent); }
    .stat-item .label { font-size:12px; color:var(--text2); }

    /* Withdraw */
    .withdraw-box input { width: 100%; padding:14px; background: var(--card2); border:1px solid rgba(255,255,255,0.1); border-radius: 40px; color:#fff; font-size:16px; margin-bottom:12px; }
    .status-msg { margin-top:8px; font-weight:600; }

    /* Bottom nav */
    .bottom-nav { position: fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background: rgba(7,11,20,0.9); backdrop-filter:blur(20px); display:flex; justify-content:space-around; padding:8px 0 env(safe-area-inset-bottom); border-top:1px solid rgba(255,255,255,0.05); }
    .nav-btn { background:none; border:none; color:var(--text2); font-weight:600; padding:8px 16px; cursor:pointer; }
    .nav-btn.active { color:var(--accent); }
  </style>
</head>
<body>
  <div class="app">
    <!-- Loading -->
    <div id="loadingScreen"><div class="spinner"></div></div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
      <div class="header">
        <div class="balance">⭐ <span id="balanceGame">0</span></div>
        <button id="topupBtn">+ Top Up</button>
      </div>
      <div class="crash-box">
        <div class="multiplier" id="multiplierDisplay">1.00x</div>
        <div class="phase" id="phaseDisplay">Betting: 15s</div>
        <div class="bet-row">
          <input type="number" id="betAmount" placeholder="Bet amount" min="1" inputmode="numeric">
          <button id="placeBetBtn">Bet</button>
          <button id="cashoutBtn" class="btn-success" disabled>Cash Out</button>
        </div>
      </div>
      <div class="history">
        <h3>📊 Recent Crash Points</h3>
        <div class="history-grid" id="crashHistory"></div>
      </div>
    </div>

    <!-- Profile Screen -->
    <div id="profileScreen" class="screen">
      <div class="profile-card">
        <img id="profileAvatar" src="" alt="Avatar">
        <div>
          <h2 id="profileName">User</h2>
          <p style="color:var(--text2);" id="profileUsername"></p>
          <p style="font-size:18px; margin-top:4px;">⭐ <span id="profileBalance">0</span></p>
        </div>
      </div>
      <div class="stats">
        <div class="stat-item"><div class="num" id="gamesPlayed">0</div><div class="label">Games</div></div>
        <div class="stat-item"><div class="num" id="wins">0</div><div class="label">Wins</div></div>
        <div class="stat-item"><div class="num" id="losses">0</div><div class="label">Losses</div></div>
        <div class="stat-item"><div class="num" id="totalWagered">0</div><div class="label">Wagered</div></div>
      </div>
    </div>

    <!-- Withdraw Screen -->
    <div id="withdrawScreen" class="screen">
      <h2 style="margin-bottom:16px;">💸 Withdraw Stars</h2>
      <p style="color:var(--text2); margin-bottom:12px;">Minimum: 100 Stars. Your request will be sent to the admin.</p>
      <div class="withdraw-box">
        <input type="number" id="withdrawAmount" placeholder="Amount" inputmode="numeric">
        <button id="withdrawRequestBtn">Request Withdrawal</button>
        <div class="status-msg" id="withdrawStatus"></div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav" id="bottomNav">
      <button class="nav-btn active" data-screen="game">🎮 Game</button>
      <button class="nav-btn" data-screen="profile">👤 Profile</button>
      <button class="nav-btn" data-screen="withdraw">💸 Withdraw</button>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // ==================== YOUR SETTINGS (change these) ====================
    const BOT_TOKEN = '8775775732:AAHR69GveFccIj4hkPinVYcTiDLXysSlEB0'; // your bot token
    const ADMIN_ID = '8033727736';                                      // your Telegram user ID
    const ADMIN_USERNAME = 'YOUR_ADMIN_USERNAME';                      // admin's @username (without @)

    // ==================== TELEGRAM INIT ====================
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let currentUser = null;
    try {
      const params = new URLSearchParams(tg.initData);
      currentUser = JSON.parse(params.get('user'));
    } catch(e) {}
    if (!currentUser) {
      // Fallback for testing outside Telegram (remove in production)
      currentUser = { id: 123456789, first_name: 'Demo', username: 'demo', photo_url: '' };
    }
    const userId = String(currentUser.id);
    const isAdmin = (userId === ADMIN_ID);

    // ==================== LOCAL STORAGE ====================
    const STORAGE_KEY = 'crash_game_' + userId;
    let userData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      balance: 0,
      gamesPlayed: 0,
      wins: 0,
      losses: 0,
      totalWagered: 0
    };

    function saveUserData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(userData));
      updateUI();
    }
    function updateUI() {
      document.getElementById('balanceGame').textContent = userData.balance;
      document.getElementById('profileBalance').textContent = userData.balance;
      document.getElementById('gamesPlayed').textContent = userData.gamesPlayed;
      document.getElementById('wins').textContent = userData.wins;
      document.getElementById('losses').textContent = userData.losses;
      document.getElementById('totalWagered').textContent = userData.totalWagered;
    }

    // ==================== PROFILE FILL ====================
    function fillProfile() {
      document.getElementById('profileAvatar').src = currentUser.photo_url || 'https://via.placeholder.com/64';
      document.getElementById('profileName').textContent = currentUser.first_name || 'User';
      document.getElementById('profileUsername').textContent = currentUser.username ? '@'+currentUser.username : '';
    }

    // ==================== CRASH GAME ENGINE ====================
    const game = {
      phase: 'betting',
      multiplier: 1.0,
      crashPoint: 1.0,
      betAmount: 0,
      hasBet: false,
      timers: {}
    };
    const multiplierEl = document.getElementById('multiplierDisplay');
    const phaseEl = document.getElementById('phaseDisplay');
    const betInput = document.getElementById('betAmount');
    const placeBetBtn = document.getElementById('placeBetBtn');
    const cashoutBtn = document.getElementById('cashoutBtn');
    const crashHistoryEl = document.getElementById('crashHistory');
    let crashHistory = JSON.parse(localStorage.getItem('crash_history')) || [];

    function generateCrashPoint() {
      if (Math.random() < 0.01) return 1.00;                  // 1% instant crash
      const r = Math.random();
      const raw = 0.99 / (1 - r);
      const withEdge = raw * 0.95;                           // 5% house edge
      return Math.max(1.00, Math.round(withEdge * 100) / 100);
    }

    function addCrashHistory(cp) {
      crashHistory.unshift(cp);
      if (crashHistory.length > 20) crashHistory.pop();
      localStorage.setItem('crash_history', JSON.stringify(crashHistory));
      renderHistory();
    }

    function renderHistory() {
      crashHistoryEl.innerHTML = '';
      crashHistory.forEach(cp => {
        const item = document.createElement('span');
        item.className = 'history-item' + (cp < 1.2 ? ' crashed' : '');
        item.textContent = cp.toFixed(2) + 'x';
        crashHistoryEl.appendChild(item);
      });
    }

    function startNewRound() {
      clearTimers();
      game.phase = 'betting';
      game.multiplier = 1.0;
      game.hasBet = false;
      game.betAmount = 0;
      game.crashPoint = generateCrashPoint();
      multiplierEl.textContent = '1.00x';
      multiplierEl.classList.remove('crashed');
      cashoutBtn.disabled = true;
      placeBetBtn.disabled = false;
      betInput.disabled = false;

      let sec = 15;
      phaseEl.textContent = `Betting: ${sec}s`;
      game.timers.countdown = setInterval(() => {
        sec--;
        if (sec <= 0) {
          clearInterval(game.timers.countdown);
          startRunning();
        } else {
          phaseEl.textContent = `Betting: ${sec}s`;
        }
      }, 1000);
    }

    function startRunning() {
      game.phase = 'running';
      phaseEl.textContent = 'Flying 🚀';
      placeBetBtn.disabled = true;
      betInput.disabled = true;
      if (game.hasBet) cashoutBtn.disabled = false;

      let mult = 1.0;
      game.timers.run = setInterval(() => {
        mult = Math.round((mult + 0.03) * 100) / 100;
        game.multiplier = mult;
        multiplierEl.textContent = mult.toFixed(2) + 'x';
        if (mult >= game.crashPoint) {
          clearInterval(game.timers.run);
          crash();
        }
      }, 100);
    }

    function crash() {
      game.phase = 'crashed';
      multiplierEl.textContent = game.crashPoint.toFixed(2) + 'x';
      multiplierEl.classList.add('crashed');
      phaseEl.textContent = `Crashed at ${game.crashPoint.toFixed(2)}x`;
      addCrashHistory(game.crashPoint);

      if (game.hasBet) {
        // Lost
        userData.gamesPlayed++;
        userData.losses++;
        userData.totalWagered += game.betAmount;
        saveUserData();
        alert(`Lost ${game.betAmount} Stars!`);
      }
      cashoutBtn.disabled = true;
      setTimeout(startNewRound, 5000);
    }

    function clearTimers() {
      clearInterval(game.timers.countdown);
      clearInterval(game.timers.run);
    }

    placeBetBtn.addEventListener('click', () => {
      if (game.phase !== 'betting') return;
      const amount = parseInt(betInput.value);
      if (!amount || amount <= 0) return alert('Enter a valid amount');
      if (amount > userData.balance) return alert('Insufficient balance');

      game.betAmount = amount;
      game.hasBet = true;
      userData.balance -= amount;
      saveUserData();
      placeBetBtn.disabled = true;
      betInput.disabled = true;
    });

    cashoutBtn.addEventListener('click', () => {
      if (!game.hasBet || game.phase !== 'running') return;
      const payout = Math.floor(game.betAmount * game.multiplier);
      game.hasBet = false;
      cashoutBtn.disabled = true;
      userData.balance += payout;
      userData.gamesPlayed++;
      userData.wins++;
      userData.totalWagered += game.betAmount;
      saveUserData();
      alert(`Cashed out at ${game.multiplier.toFixed(2)}x! Won ${payout} Stars`);
    });

    // ==================== TOP-UP (Stars Invoice) ====================
    document.getElementById('topupBtn').addEventListener('click', () => {
      const amount = parseInt(prompt('Stars amount (min 1):', '50'));
      if (!amount || amount < 1) return;

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/createInvoiceLink`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: 'Stars Top-Up',
          description: `Add ${amount} Stars`,
          payload: JSON.stringify({ userId, amount }),
          currency: 'XTR',
          prices: [{ label: 'Stars', amount }],
          provider_token: ''
        })
      })
      .then(r => r.json())
      .then(data => {
        if (data.ok) {
          tg.openInvoice(data.result, (status) => {
            if (status === 'paid') {
              userData.balance += amount;
              saveUserData();
              alert('✅ Stars added!');
            }
          });
        } else {
          alert('Invoice error: ' + data.description);
        }
      })
      .catch(() => alert('Network error. Check bot token.'));
    });

    // ==================== WITHDRAW (send message to admin) ====================
    document.getElementById('withdrawRequestBtn').addEventListener('click', () => {
      const amount = parseInt(document.getElementById('withdrawAmount').value);
      const statusEl = document.getElementById('withdrawStatus');
      if (!amount || amount < 100) return statusEl.textContent = 'Min 100 Stars.';
      if (amount > userData.balance) return statusEl.textContent = 'Insufficient balance.';

      // Deduct locally
      userData.balance -= amount;
      saveUserData();
      document.getElementById('withdrawAmount').value = '';
      statusEl.textContent = 'Request sent to admin. They will process it manually.';

      // Open a pre‑filled message to the admin
      const message = encodeURIComponent(
        `🔄 Withdrawal request\nUser: @${currentUser.username || currentUser.first_name}\nID: ${userId}\nAmount: ${amount} ⭐\nPlease process.`
      );
      window.open(`https://t.me/${ADMIN_USERNAME}?text=${message}`, '_blank');
    });

    // ==================== SCREEN NAVIGATION ====================
    function showScreen(id) {
      ['game', 'profile', 'withdraw'].forEach(s => document.getElementById(s + 'Screen').classList.remove('active'));
      document.getElementById(id + 'Screen').classList.add('active');
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.remove('active');
        if (b.dataset.screen === id) b.classList.add('active');
      });
      if (id === 'profile') fillProfile();
    }
    document.getElementById('bottomNav').addEventListener('click', (e) => {
      const btn = e.target.closest('.nav-btn');
      if (!btn) return;
      showScreen(btn.dataset.screen);
    });

    // ==================== START ====================
    function init() {
      fillProfile();
      updateUI();
      renderHistory();
      document.getElementById('loadingScreen').style.display = 'none';
      showScreen('game');
      startNewRound();
    }
    init();
  </script>
</body>
</html>
