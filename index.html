<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="telegram-web-app" content="yes">
  <title>Crash Game</title>
  <!-- Firebase Realtime Database compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg: #070b14; --card: #101524; --card2: #1a1f33;
      --text: #fff; --text2: #99a0b8; --accent: #00d4ff;
      --danger: #ff4757; --success: #2ed573; --radius: 16px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; user-select: none; -webkit-tap-highlight-color: transparent; }
    .app { max-width: 480px; margin: 0 auto; padding: 16px 16px 80px; }
    .screen { display: none; }
    .screen.active { display: block; }

    /* Loading */
    #loadingScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; text-align: center; }
    .spinner { width: 48px; height: 48px; border: 4px solid var(--card2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .balance { background: var(--card); padding: 8px 16px; border-radius: 40px; font-weight: 600; }
    button { border: none; background: var(--accent); color: #000; padding: 10px 18px; border-radius: 40px; font-weight: 700; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.4; pointer-events: none; }
    .btn-success { background: var(--success); color: #000; }
    .btn-danger { background: var(--danger); color: #fff; }

    /* Crash display */
    .crash-box { background: var(--card); border-radius: var(--radius); padding: 24px; text-align: center; }
    .multiplier { font-size: 72px; font-weight: 900; background: linear-gradient(135deg, #00d4ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .multiplier.crashed { background: linear-gradient(135deg, #ff4757, #ff6b81); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shake 0.5s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 40%{transform:translateX(10px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
    .phase { color: var(--text2); margin: 8px 0 16px; font-size: 14px; }
    .bet-row { display: flex; gap: 8px; margin-top: 16px; }
    .bet-row input { flex:1; background: var(--card2); border: 1px solid rgba(255,255,255,0.1); border-radius: 40px; padding: 12px 16px; color:#fff; font-size:16px; }

    /* History */
    .history { margin-top: 24px; }
    .history h3 { color: var(--text2); margin-bottom:12px; }
    .history-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .history-item { background: var(--card); border-radius: 20px; padding: 4px 12px; font-size: 14px; font-weight:600; }
    .history-item.crashed { color: var(--danger); }

    /* Profile */
    .profile-card { background: var(--card); border-radius: var(--radius); padding: 20px; display: flex; gap:16px; align-items: center; margin-bottom: 20px; }
    .profile-card img { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--accent); }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap:12px; }
    .stat-item { background: var(--card); border-radius: var(--radius); padding: 14px; text-align: center; }
    .stat-item .num { font-size: 22px; font-weight:700; color:var(--accent); }
    .stat-item .label { font-size:12px; color:var(--text2); }

    /* Withdraw */
    .withdraw-box input { width: 100%; padding:14px; background: var(--card2); border:1px solid rgba(255,255,255,0.1); border-radius: 40px; color:#fff; font-size:16px; margin-bottom:12px; }
    .status-msg { margin-top:8px; font-weight:600; }

    /* Admin */
    .wd-card { background: var(--card); border-radius: var(--radius); padding:14px; margin-bottom:10px; }
    .wd-card .actions { display: flex; gap:8px; margin-top:8px; }

    /* Bottom nav */
    .bottom-nav { position: fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background: rgba(7,11,20,0.9); backdrop-filter:blur(20px); display:flex; justify-content:space-around; padding:8px 0 env(safe-area-inset-bottom); border-top:1px solid rgba(255,255,255,0.05); }
    .nav-btn { background:none; border:none; color:var(--text2); font-weight:600; padding:8px 16px; cursor:pointer; }
    .nav-btn.active { color:var(--accent); }

    .error-message { color: var(--danger); margin-top: 16px; max-width: 90%; }
  </style>
</head>
<body>
  <div class="app">
    <!-- Loading screen -->
    <div id="loadingScreen">
      <div class="spinner"></div>
      <p id="loadingText" style="margin-top:16px; color:var(--text2)">Initializing...</p>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
      <div class="header">
        <div class="balance">⭐ <span id="balanceGame">0</span></div>
        <button id="topupBtn">+ Top Up</button>
      </div>
      <div class="crash-box">
        <div class="multiplier" id="multiplierDisplay">1.00x</div>
        <div class="phase" id="phaseDisplay">Betting: 15s</div>
        <div class="bet-row">
          <input type="number" id="betAmount" placeholder="Bet amount" min="1" inputmode="numeric">
          <button id="placeBetBtn">Bet</button>
          <button id="cashoutBtn" class="btn-success" disabled>Cash Out</button>
        </div>
      </div>
      <div class="history">
        <h3>📊 Recent Crash Points</h3>
        <div class="history-grid" id="crashHistory"></div>
      </div>
    </div>

    <!-- Profile Screen -->
    <div id="profileScreen" class="screen">
      <div class="profile-card">
        <img id="profileAvatar" src="" alt="Avatar">
        <div>
          <h2 id="profileName">User</h2>
          <p style="color:var(--text2);" id="profileUsername"></p>
          <p style="font-size:18px; margin-top:4px;">⭐ <span id="profileBalance">0</span></p>
        </div>
      </div>
      <div class="stats">
        <div class="stat-item"><div class="num" id="gamesPlayed">0</div><div class="label">Games</div></div>
        <div class="stat-item"><div class="num" id="wins">0</div><div class="label">Wins</div></div>
        <div class="stat-item"><div class="num" id="losses">0</div><div class="label">Losses</div></div>
        <div class="stat-item"><div class="num" id="totalWagered">0</div><div class="label">Wagered</div></div>
      </div>
    </div>

    <!-- Withdraw Screen -->
    <div id="withdrawScreen" class="screen">
      <h2 style="margin-bottom:16px;">💸 Withdraw Stars</h2>
      <p style="color:var(--text2); margin-bottom:12px;">Minimum withdrawal: 100 ⭐</p>
      <div class="withdraw-box">
        <input type="number" id="withdrawAmount" placeholder="Amount" inputmode="numeric">
        <button id="withdrawRequestBtn">Request Withdrawal</button>
        <div class="status-msg" id="withdrawStatus"></div>
      </div>
    </div>

    <!-- Admin Screen (hidden unless admin) -->
    <div id="adminScreen" class="screen">
      <h2 style="margin-bottom:16px;">⚙️ Admin Panel</h2>
      <div id="pendingWithdrawals">Loading...</div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav" id="bottomNav">
      <button class="nav-btn active" data-screen="game">🎮 Game</button>
      <button class="nav-btn" data-screen="profile">👤 Profile</button>
      <button class="nav-btn" data-screen="withdraw">💸 Withdraw</button>
      <button class="nav-btn" data-screen="admin" id="adminNavBtn" style="display:none;">⚙️ Admin</button>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // ==================== YOUR CONFIGURATION ====================
    // 1. Firebase config (already pasted – do NOT change)
    const firebaseConfig = {
      apiKey: "AIzaSyA0xSWDVYH4qq_tZtwMoAVmaDYJTxDiWVc",
      authDomain: "hobbyhubtest-d9e15.firebaseapp.com",
      databaseURL: "https://hobbyhubtest-d9e15-default-rtdb.firebaseio.com",
      projectId: "hobbyhubtest-d9e15",
      storageBucket: "hobbyhubtest-d9e15.firebasestorage.app",
      messagingSenderId: "973454715972",
      appId: "1:973454715972:web:8aaab7bacccaf7e35c6011",
      measurementId: "G-3Y3DQMX46W"
    };

    // 2. Replace with your real bot token from @BotFather
    const BOT_TOKEN = '8775775732:AAHR69GveFccIj4hkPinVYcTiDLXysSlEB0';

    // 3. Put your Telegram user IDs here to be admins
    const ADMIN_IDS = ['8033727736'];

    // ==================== INITIALIZATION ====================
    firebase.initializeApp(firebaseConfig);
    const rtdb = firebase.database();

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Extract Telegram user (or fallback for browser testing)
    let currentUser = null;
    try {
      const params = new URLSearchParams(tg.initData);
      currentUser = JSON.parse(params.get('user'));
    } catch(e) {}
    if (!currentUser) {
      // Fallback – remove in production
      currentUser = { id: 123456789, first_name: 'Demo', username: 'demo', photo_url: '' };
    }
    const userId = String(currentUser.id);
    const userRef = rtdb.ref('users/' + userId);
    const isAdmin = ADMIN_IDS.includes(userId);

    // ==================== LOADING & ERROR HANDLING ====================
    const loadingScreen = document.getElementById('loadingScreen');
    const loadingText = document.getElementById('loadingText');

    function showError(message) {
      loadingScreen.innerHTML = `<div class="error-message">❌ ${message}</div>`;
    }

    // ==================== BALANCE & PROFILE HELPERS ====================
    let userBalance = 0;

    function updateBalanceDisplay() {
      document.getElementById('balanceGame').textContent = userBalance;
      document.getElementById('profileBalance').textContent = userBalance;
    }

    async function createUserIfNeeded() {
      const snap = await userRef.once('value');
      if (!snap.exists()) {
        await userRef.set({
          id: userId,
          username: currentUser.username || '',
          firstName: currentUser.first_name || '',
          photoUrl: currentUser.photo_url || '',
          balance: 0,
          gamesPlayed: 0,
          wins: 0,
          losses: 0,
          totalWagered: 0
        });
      }
    }

    async function loadUserData() {
      try {
        loadingText.textContent = 'Connecting to Firebase...';
        await createUserIfNeeded();
        const snap = await userRef.once('value');
        const data = snap.val() || {};
        userBalance = data.balance || 0;
        updateBalanceDisplay();
        fillProfile(data);
        return true;
      } catch (err) {
        console.error(err);
        showError('Failed to load user data. Check the browser console (F12) for details.');
        return false;
      }
    }

    function fillProfile(data) {
      document.getElementById('profileAvatar').src = data.photoUrl || 'https://via.placeholder.com/64';
      document.getElementById('profileName').textContent = data.firstName || 'User';
      document.getElementById('profileUsername').textContent = data.username ? '@'+data.username : '';
      document.getElementById('gamesPlayed').textContent = data.gamesPlayed || 0;
      document.getElementById('wins').textContent = data.wins || 0;
      document.getElementById('losses').textContent = data.losses || 0;
      document.getElementById('totalWagered').textContent = data.totalWagered || 0;
    }

    async function refreshBalance() {
      const snap = await userRef.child('balance').once('value');
      userBalance = snap.val() || 0;
      updateBalanceDisplay();
    }

    // ==================== TRANSACTION HELPERS (safe updates) ====================
    // Realtime Database transactions return { committed, snapshot }
    function incrementBalance(amount) {
      return userRef.child('balance').transaction(current => (current || 0) + amount);
    }

    function incrementStat(field, amount) {
      return userRef.child(field).transaction(current => (current || 0) + amount);
    }

    // ==================== SCREEN SWITCHING ====================
    const screens = ['game', 'profile', 'withdraw', 'admin'];
    function showScreen(id) {
      screens.forEach(s => document.getElementById(s + 'Screen').classList.remove('active'));
      document.getElementById(id + 'Screen').classList.add('active');
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.remove('active');
        if (b.dataset.screen === id) b.classList.add('active');
      });
      if (id === 'profile') {
        userRef.once('value').then(snap => fillProfile(snap.val() || {}));
      }
      if (id === 'admin') loadPendingWithdrawals();
    }

    document.getElementById('bottomNav').addEventListener('click', (e) => {
      const btn = e.target.closest('.nav-btn');
      if (!btn) return;
      showScreen(btn.dataset.screen);
    });

    if (isAdmin) document.getElementById('adminNavBtn').style.display = 'block';

    // ==================== CRASH GAME ENGINE ====================
    const game = {
      phase: 'betting',
      multiplier: 1.0,
      crashPoint: 1.0,
      betAmount: 0,
      hasBet: false,
      countdownTimer: null,
      runTimer: null
    };

    const multiplierEl = document.getElementById('multiplierDisplay');
    const phaseEl = document.getElementById('phaseDisplay');
    const betInput = document.getElementById('betAmount');
    const placeBetBtn = document.getElementById('placeBetBtn');
    const cashoutBtn = document.getElementById('cashoutBtn');
    const crashHistoryEl = document.getElementById('crashHistory');

    function generateCrashPoint() {
      if (Math.random() < 0.01) return 1.00;
      const r = Math.random();
      const raw = 0.99 / (1 - r);
      const withEdge = raw * 0.95; // 5% house edge
      return Math.max(1.00, Math.round(withEdge * 100) / 100);
    }

    function addCrashHistory(cp) {
      const item = document.createElement('span');
      item.className = 'history-item' + (cp < 1.2 ? ' crashed' : '');
      item.textContent = cp.toFixed(2) + 'x';
      crashHistoryEl.prepend(item);
      while (crashHistoryEl.children.length > 20) crashHistoryEl.lastChild.remove();
    }

    function clearGameTimers() {
      if (game.countdownTimer) clearInterval(game.countdownTimer);
      if (game.runTimer) clearInterval(game.runTimer);
    }

    async function startNewRound() {
      clearGameTimers();
      game.phase = 'betting';
      game.multiplier = 1.0;
      game.hasBet = false;
      game.betAmount = 0;
      game.crashPoint = generateCrashPoint();
      multiplierEl.textContent = '1.00x';
      multiplierEl.classList.remove('crashed');
      cashoutBtn.disabled = true;
      placeBetBtn.disabled = false;
      betInput.disabled = false;

      let sec = 15;
      phaseEl.textContent = `Betting: ${sec}s`;
      game.countdownTimer = setInterval(() => {
        sec--;
        if (sec <= 0) {
          clearInterval(game.countdownTimer);
          startRunning();
        } else {
          phaseEl.textContent = `Betting: ${sec}s`;
        }
      }, 1000);
    }

    function startRunning() {
      game.phase = 'running';
      phaseEl.textContent = 'Flying 🚀';
      placeBetBtn.disabled = true;
      betInput.disabled = true;
      if (game.hasBet) cashoutBtn.disabled = false;

      let mult = 1.0;
      game.runTimer = setInterval(() => {
        mult = Math.round((mult + 0.03) * 100) / 100;
        game.multiplier = mult;
        multiplierEl.textContent = mult.toFixed(2) + 'x';
        if (mult >= game.crashPoint) {
          clearInterval(game.runTimer);
          crash();
        }
      }, 100);
    }

    async function crash() {
      game.phase = 'crashed';
      multiplierEl.textContent = game.crashPoint.toFixed(2) + 'x';
      multiplierEl.classList.add('crashed');
      phaseEl.textContent = `Crashed at ${game.crashPoint.toFixed(2)}x`;
      addCrashHistory(game.crashPoint);

      // Save crash point to history
      rtdb.ref('gameHistory').push({
        crashPoint: game.crashPoint,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });

      if (game.hasBet) {
        // User lost – update stats
        await Promise.all([
          incrementStat('gamesPlayed', 1),
          incrementStat('losses', 1),
          incrementStat('totalWagered', game.betAmount)
        ]);
        refreshBalance();
        alert(`Lost ${game.betAmount} Stars!`);
      }
      cashoutBtn.disabled = true;
      setTimeout(() => startNewRound(), 5000);
    }

    placeBetBtn.addEventListener('click', async () => {
      if (game.phase !== 'betting') return;
      const amount = parseInt(betInput.value);
      if (!amount || amount <= 0) return alert('Enter a valid amount');
      if (amount > userBalance) return alert('Insufficient balance');

      game.betAmount = amount;
      game.hasBet = true;
      // Deduct balance immediately
      await incrementBalance(-amount);
      await refreshBalance();
      placeBetBtn.disabled = true;
      betInput.disabled = true;
    });

    cashoutBtn.addEventListener('click', async () => {
      if (!game.hasBet || game.phase !== 'running') return;
      const payout = Math.floor(game.betAmount * game.multiplier);
      game.hasBet = false;
      cashoutBtn.disabled = true;

      // Update balance and stats
      await Promise.all([
        incrementBalance(payout),
        incrementStat('gamesPlayed', 1),
        incrementStat('wins', 1),
        incrementStat('totalWagered', game.betAmount)
      ]);
      refreshBalance();
      alert(`Cashed out at ${game.multiplier.toFixed(2)}x! Won ${payout} Stars`);
    });

    // ==================== TOP-UP (Stars Invoice) ====================
    document.getElementById('topupBtn').addEventListener('click', () => {
      const amount = parseInt(prompt('Stars amount (min 1):', '50'));
      if (!amount || amount < 1) return;

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/createInvoiceLink`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: 'Stars Top-Up',
          description: `Add ${amount} Stars`,
          payload: JSON.stringify({ userId, amount }),
          currency: 'XTR',
          prices: [{ label: 'Stars', amount }],
          provider_token: ''
        })
      })
      .then(r => r.json())
      .then(data => {
        if (data.ok) {
          tg.openInvoice(data.result, async (status) => {
            if (status === 'paid') {
              await incrementBalance(amount);
              refreshBalance();
              alert('✅ Stars added!');
            }
          });
        } else {
          alert('Invoice error: ' + data.description);
        }
      })
      .catch(() => alert('Network error. Check your bot token.'));
    });

    // ==================== WITHDRAWAL ====================
    document.getElementById('withdrawRequestBtn').addEventListener('click', async () => {
      const amount = parseInt(document.getElementById('withdrawAmount').value);
      const statusEl = document.getElementById('withdrawStatus');
      if (!amount || amount < 100) return statusEl.textContent = 'Minimum withdrawal is 100 Stars.';
      if (amount > userBalance) return statusEl.textContent = 'Insufficient balance.';

      statusEl.textContent = 'Processing...';
      try {
        // Use transaction to deduct balance and push withdrawal request atomically
        await userRef.child('balance').transaction(async (current) => {
          if (current === null || current < amount) {
            // Return undefined to abort transaction
            return;
          }
          return current - amount;
        });

        // After successful deduction, push withdrawal request
        await rtdb.ref('withdrawals').push({
          userId,
          username: currentUser.username || currentUser.first_name,
          amount,
          status: 'pending',
          timestamp: firebase.database.ServerValue.TIMESTAMP
        });

        statusEl.textContent = '✅ Request submitted. Admins will review.';
        refreshBalance();
        document.getElementById('withdrawAmount').value = '';
      } catch (e) {
        statusEl.textContent = '❌ ' + (e.message || 'Transaction failed');
      }
    });

    // ==================== ADMIN PANEL ====================
    function loadPendingWithdrawals() {
      if (!isAdmin) return;
      rtdb.ref('withdrawals')
        .orderByChild('status')
        .equalTo('pending')
        .on('value', snapshot => {
          const container = document.getElementById('pendingWithdrawals');
          container.innerHTML = '';
          if (!snapshot.exists()) {
            container.innerHTML = '<p style="color:var(--text2)">No pending withdrawals.</p>';
            return;
          }
          snapshot.forEach(child => {
            const w = child.val();
            container.innerHTML += `
              <div class="wd-card">
                <strong>${w.username}</strong> (ID: ${w.userId})<br>
                Amount: <b>${w.amount} ⭐</b>
                <div class="actions">
                  <button class="btn-success" onclick="window.approveWd('${child.key}')">Approve</button>
                  <button class="btn-danger" onclick="window.rejectWd('${child.key}', '${w.userId}', ${w.amount})">Reject</button>
                </div>
              </div>`;
          });
        });
    }

    window.approveWd = async (wdId) => {
      await rtdb.ref('withdrawals/' + wdId).update({ status: 'approved' });
    };

    window.rejectWd = async (wdId, uid, amount) => {
      // Refund balance
      await rtdb.ref('users/' + uid + '/balance').transaction(cur => (cur || 0) + amount);
      await rtdb.ref('withdrawals/' + wdId).update({ status: 'rejected' });
    };

    // ==================== LOAD CRASH HISTORY ====================
    async function loadHistoryFromDb() {
      const snap = await rtdb.ref('gameHistory').orderByChild('timestamp').limitToLast(20).once('value');
      if (snap.exists()) {
        const values = [];
        snap.forEach(child => values.push(child.val().crashPoint));
        values.reverse().forEach(cp => addCrashHistory(cp));
      }
    }

    // ==================== START APP ====================
    (async () => {
      const success = await loadUserData();
      if (!success) return;

      await loadHistoryFromDb();
      loadingScreen.style.display = 'none';
      showScreen('game');
      startNewRound();
    })();
  </script>
</body>
</html>
